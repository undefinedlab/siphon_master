[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Link the canonical poseidon-solidity deployments instead of deploying our own. Our via_ir build
# of these libraries is 29315/32895 bytes — both over EIP-170 (24576) — so forge's automatic
# library deploy aborts the broadcast on any real chain. The canonical builds are 23478/14189 and
# are already live on Sepolia AND Base at these addresses.
libraries = [
    "node_modules/poseidon-solidity/PoseidonT3.sol:PoseidonT3:0x3333333C0A88F9BE4fd23ed0536F9B6c427e3B93",
    "node_modules/poseidon-solidity/PoseidonT4.sol:PoseidonT4:0x4443338EF595F44e0121df4C21102677B142ECF0",
]
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../fixtures" },
    { access = "read", path = "../../siphon-zkv2" },
    { access = "read-write", path = "./deployments" }
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${ETH_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"
