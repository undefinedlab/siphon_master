[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
siphon_vault = "Eip1D6GPh5hc3qrJVBcghd3W3KSPszqyRYbn6XPi9MWj"

[programs.devnet]
siphon_vault = "Eip1D6GPh5hc3qrJVBcghd3W3KSPszqyRYbn6XPi9MWj"

[provider]
