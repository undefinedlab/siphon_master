[package]
name = "siphon-vault-onchain"
version = "0.1.0"
description = "Siphon Solana Devnet BPF vault (hackathon MVP) — SPL deposit + note PDAs"
edition = "2021"
license = "MIT"

# Standalone workspace for cargo-build-sbf (excluded from host solana/Cargo.toml).
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "siphon_vault"
path = "src/lib.rs"

[features]
# Retired name. It does not enable spend or strategy_swap; both fail closed.
scaffold-verify = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
