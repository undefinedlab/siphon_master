[package]
name = "siphon-vault-zk"
version = "0.1.0"
description = "Siphon Solana ZK vault BPF — Poseidon tree + Groth16 alt_bn128 verify"
edition = "2021"
license = "MIT"

# Standalone workspace for cargo-build-sbf (excluded from host solana/Cargo.toml).
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "siphon_vault_zk"
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
groth16-solana = "0.2"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[dev-dependencies]
hex = "0.4"
