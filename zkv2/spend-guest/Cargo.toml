[package]
name = "spend-guest"
version = "0.1.0"
edition = "2021"
description = "Native limb commit wrapper around spend-core (CI / siphon-prove) — not a zkVM guest"

[features]
default = ["native"]
native = []

[dependencies]
spend-core = { path = "../spend-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
