[pytest]
# anchorpy and web3 auto-register pytest plugins with broken/heavy imports (pytest_asyncio,
# eth_typing.ContractName) that nothing here needs; keep them out of the test session.
# web3==6.15.1 pulls in pytest_ethereum, whose `from eth_typing import ContractName` no longer
# resolves — without this the session dies during argument parsing, before a single test runs.
# Same guard api-gateway/pytest.ini and trade-executor/pytest.ini already carry.
addopts = -p no:anchorpy -p no:pytest_ethereum
