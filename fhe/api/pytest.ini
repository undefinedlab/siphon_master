[pytest]
testpaths = tests
python_files = test_*.py
# anchorpy and web3 auto-register pytest plugins with broken/heavy imports (pytest_asyncio,
# eth_typing.ContractName) that these contract tests don't need; keep them out of the session
# so collection doesn't crash when the trade-executor venv (web3/anchorpy) is on the path.
addopts = -q -p no:anchorpy -p no:pytest_ethereum
