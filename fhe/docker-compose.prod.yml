      - DATABASE_URL=postgresql://siphon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/siphon_indexer
      - DATABASE_SCHEMA=feepool2_sepolia_legacy
      - PONDER_RPC_URL_11155111=${PONDER_RPC_URL_11155111:-https://ethereum-sepolia-rpc.publicnode.com}
      - PONDER_MAX_RPS=${PONDER_MAX_RPS:-8}
      - INDEXER_RETRY_MS=${INDEXER_RETRY_MS:-15000}
      - INDEXER_CHILD_RECYCLE_MS=${INDEXER_CHILD_RECYCLE_MS:-1800000}
      - SEPOLIA_LOG_MAXRANGE=${SEPOLIA_LOG_MAXRANGE:-9000}
      - SEPOLIA_DEPLOY_BLOCK=${SEPOLIA_LEGACY_DEPLOY_BLOCK:-11278082}
      - MERKLE_TREE_SEPOLIA_ETH=${MERKLE_TREE_SEPOLIA_LEGACY_ETH:-0xC7Ad7eA094942239218ABE33D1EbD77349Bd8f99}
      - MERKLE_TREE_SEPOLIA_USDC=${MERKLE_TREE_SEPOLIA_LEGACY_USDC:-0x20EfA6c1138570600BE6ad4F60965696D5BC88DD}
      - VAULT_SEPOLIA_ETH=${VAULT_SEPOLIA_LEGACY_ETH:-0x8BC94f9b057CB56D5F32d1B8D509Ce239A9Cc249}
      - VAULT_SEPOLIA_USDC=${VAULT_SEPOLIA_LEGACY_USDC:-0x8Ce8bb803e53E807447e0da405025A0975d9A773}
      # Identity + manifest binding (see indexer-base comment).
      - INDEXER_GENERATION_ID=sepolia-soft-era
      - INDEXER_ENTRYPOINT=${SEPOLIA_LEGACY_ENTRYPOINT:-0xE5126A49D1bb93957b4B2F63BCB05a1F8EA9e705}
      - GENERATION_MANIFEST_PATH=/etc/siphon/generation-manifest.json
      - GENERATION_MANIFEST_SHA256=${GENERATION_MANIFEST_SHA256:?GENERATION_MANIFEST_SHA256 must pin config/generation-manifest.json}
    volumes:
