      start_period: 60s

  # 4c. Sepolia soft-era EXIT_ONLY indexer. It keeps old commitments discoverable without
  # allowing its cursor or RPC failures to affect the current Hard ASP lane.
  siphon-indexer-sepolia-legacy:
    build: ../siphon-indexer
    container_name: siphon-indexer-sepolia-legacy
    init: true
    ports:
      - "127.0.0.1:42071:42069"
    environment:
