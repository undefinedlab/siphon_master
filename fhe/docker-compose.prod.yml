      - MERKLE_TREE_SEPOLIA_ETH=${MERKLE_TREE_SEPOLIA_CURRENT_ETH:-0x2a9C7e0603611062C872FA58083Da4394aa8623a}
      - MERKLE_TREE_SEPOLIA_USDC=${MERKLE_TREE_SEPOLIA_CURRENT_USDC:-0xE895a7ECbF7Ea9fb856CE685145B1C8fc97bBd28}
      - VAULT_SEPOLIA_ETH=${VAULT_SEPOLIA_CURRENT_ETH:-0x6e0c4A1f7adAf0f80a4881a2635C0AFfE998fBDe}
      - VAULT_SEPOLIA_USDC=${VAULT_SEPOLIA_CURRENT_USDC:-0x50A3bc1Cd443fe5bd0A9FbF04FF655E4b54Deb3b}
      # Identity + manifest binding (see indexer-base comment).
      - INDEXER_GENERATION_ID=${INDEXER_VAULT_GENERATION_11155111:?INDEXER_VAULT_GENERATION_11155111 must be set}
      - INDEXER_ENTRYPOINT=${ETH_SEPOLIA_ENTRYPOINT:?ETH_SEPOLIA_ENTRYPOINT must be set}
