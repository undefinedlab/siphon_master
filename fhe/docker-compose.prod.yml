        max-file: "3"
    healthcheck:
      test: [ "CMD", "node", "scripts/indexer-health.mjs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 5. API gateway — /v1/keys packs, purchase, verify (createStrategy hard gate).
  # Caddy routes /v1/* here. Fresh postgres volumes get siphon_gateway via docker/postgres-init;
  # existing volumes need: CREATE DATABASE siphon_gateway; (once).
  api-gateway:
    build: ./api-gateway
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/siphon-api-gateway:${VERSION:-latest}
    container_name: siphon-api-gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Error tracking (GAPS Epic 3). Unset -> observability.py no-ops, so this is inert
      # until a DSN is present. Redaction rules live in each service's observability.py.
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Session-key delegation origin pin (session_key.py). Comma-separated hosts, matching
      # window.location.host — the apex, www, and the localhost origins Caddy already allows for
      # local frontends. Unset = no constraint, which is the pre-session-key behaviour; a value
      # that omits a host users actually browse from hard-401s them with no client-side fallback.
      - SESSION_EXPECTED_DOMAIN=${SESSION_EXPECTED_DOMAIN:-}
      - SIPHON_ENV=${API_GATEWAY_SIPHON_ENV:-production}
      - DATABASE_URL=postgresql://siphon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/siphon_gateway
      - REDIS_URL=${API_GATEWAY_REDIS_URL:?API_GATEWAY_REDIS_URL must be set}
      - RECONCILE_ENABLED=${API_GATEWAY_RECONCILE_ENABLED:-false}
      - RUN_RECONCILER_IN_WORKER=0
      - RUN_WEBHOOKS_IN_WORKER=0
      - RUN_OPERATION_MONITOR_IN_WORKER=0
      - API_KEY_PEPPER=${API_KEY_PEPPER:?API_KEY_PEPPER must be set}
      - BILLING_REF_HMAC_KEY=${BILLING_REF_HMAC_KEY:?BILLING_REF_HMAC_KEY must be set}
      # Signs compliance receipts. app/boot_guards.py ABORTS startup in production while this is
      # still the dev default, so an unset value is a crash loop, not a silent weak key — required
      # here rather than defaulted for that reason.
      - RECEIPT_SIGNING_KEY=${RECEIPT_SIGNING_KEY:?RECEIPT_SIGNING_KEY must be set}
      - EXECUTOR_URL=http://trade-executor:5005
      - EXECUTOR_API_TOKEN=${API_TOKEN:?API_TOKEN must be set}
      - RELAYER_URL=http://proving-relayer:5010
      - INDEXER_URL_BASE=http://siphon-indexer-base:42069
      - INDEXER_URL_SEPOLIA=http://siphon-indexer-sepolia:42069
      - INDEXER_URL_SEPOLIA_LEGACY=http://siphon-indexer-sepolia-legacy:42069
      - BASE_MAINNET_RPC=http://siphon-base-rpc:8545
      - ETH_SEPOLIA_RPC=${ETH_SEPOLIA_RPC:-https://ethereum-sepolia-rpc.publicnode.com}
      # v5 (VaultKernel) per-chain services — gateway 2.0. No cross-chain fallback by design:
      # an unset chain answers 503 rather than borrowing another chain's credentials.
      - ARBITRUM_RPC=${ARBITRUM_RPC:-https://arb1.arbitrum.io/rpc}
      - ASP_URL=http://siphon-aspv5-asp-1:5056
      - ASP_SCREEN_TOKEN=${GATEWAY_V5_ASP_SCREEN_TOKEN:?GATEWAY_V5_ASP_SCREEN_TOKEN must be set}
      - ASP_POSTMAN_TOKEN=${GATEWAY_V5_ASP_POSTMAN_TOKEN:?GATEWAY_V5_ASP_POSTMAN_TOKEN must be set}
      - V5_INDEXER_URL_8453=http://siphon-indexer-v3base:42069
      - V5_INDEXER_URL_42161=https://16-192-140-158.sslip.io/idx
      - EXECUTOR_URL_42161=https://16-192-140-158.sslip.io
      - ASP_URL_42161=https://16-192-140-158.sslip.io/aspv5
      - ASP_SCREEN_TOKEN_42161=${GATEWAY_ASP_SCREEN_TOKEN_42161:-}
      - ASP_POSTMAN_TOKEN_42161=${GATEWAY_ASP_POSTMAN_TOKEN_42161:-}
      - API_CREDIT_COLLECTOR=${API_CREDIT_COLLECTOR:-}
      - ACTIVE_VAULT_GENERATION_8453=${ACTIVE_VAULT_GENERATION_8453:-}
      - ACTIVE_VAULT_GENERATION_11155111=${ACTIVE_VAULT_GENERATION_11155111:?ACTIVE_VAULT_GENERATION_11155111 must be set}
      - EXIT_ONLY_VAULT_GENERATIONS=${EXIT_ONLY_VAULT_GENERATIONS:?EXIT_ONLY_VAULT_GENERATIONS must be set}
      # Checksum-pinned canonical generation manifest (see trade-executor comment).
      - GENERATION_MANIFEST_PATH=/etc/siphon/generation-manifest.json
      - GENERATION_MANIFEST_SHA256=${GENERATION_MANIFEST_SHA256:?GENERATION_MANIFEST_SHA256 must pin config/generation-manifest.json}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trade-executor:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/v1/liveness" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Gateway reuses the executor sanctions helper and its import-time ASP dependency.
      - ./trade-executor/address_validator.py:/app/address_validator.py:ro
      - ./trade-executor/asp_membership.py:/app/asp_membership.py:ro
      # Session-key delegation verifier. app/reuse.py imports it at module scope, so without this
      # mount every gateway worker dies at import with "No module named 'session_key'" — the
      # pythonpath in pytest.ini makes the tests pass while the container refuses to boot.
      - ./trade-executor/session_key.py:/app/session_key.py:ro
      # /v1/deposits resolves asset addresses through the executor chain config; without
      # this mount the route 400s with "No module named 'evm_chain_config'".
      - ./trade-executor/evm_chain_config.py:/app/evm_chain_config.py:ro
      - ./config/generation-manifest.json:/etc/siphon/generation-manifest.json:ro

  # Single owner for usage reconciliation, chain confirmation, and webhook delivery. Keeping these
  # loops out of Gunicorn prevents duplicate polling and duplicate webhook enqueue/delivery races.
  api-gateway-worker:
    build: ./api-gateway
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/siphon-api-gateway:${VERSION:-latest}
    container_name: siphon-api-gateway-worker
    command: ["python", "worker_main.py"]
    # The image's HEALTHCHECK curls /v1/liveness, which only exists under gunicorn. This service
    # runs the background loops instead, so that probe can never pass and the container sits
    # permanently "unhealthy" — which is how a real failure here would go unnoticed. There is no
    # endpoint to substitute, and a process check adds nothing over the restart policy: if
    # worker_main exits, the container exits. No healthcheck is the honest state.
    healthcheck:
      disable: true
    environment:
      - SIPHON_ENV=${API_GATEWAY_SIPHON_ENV:-production}
      - DATABASE_URL=postgresql://siphon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/siphon_gateway
      # Pinned, never a memory:// fallback: an in-process limiter is per-worker and resets on
      # restart, so the rate limit silently stops being a rate limit. The `redis` service in this
      # file is always present. test_indexer_compose_isolation pins this.
      - REDIS_URL=redis://redis:6379/0
      - RECONCILE_ENABLED=${API_GATEWAY_RECONCILE_ENABLED:-true}
      - OPERATION_MONITOR_ENABLED=${API_GATEWAY_OPERATION_MONITOR_ENABLED:-true}
      - WEBHOOK_ENABLED=${API_GATEWAY_WEBHOOK_ENABLED:-true}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?API_KEY_PEPPER must be set}
      - BILLING_REF_HMAC_KEY=${BILLING_REF_HMAC_KEY:?BILLING_REF_HMAC_KEY must be set}
      # Signs compliance receipts. app/boot_guards.py ABORTS startup in production while this is
      # still the dev default, so an unset value is a crash loop, not a silent weak key — required
      # here rather than defaulted for that reason.
      - RECEIPT_SIGNING_KEY=${RECEIPT_SIGNING_KEY:?RECEIPT_SIGNING_KEY must be set}
      - EXECUTOR_URL=http://trade-executor:5005
      - EXECUTOR_API_TOKEN=${API_TOKEN}
      - BASE_MAINNET_RPC=http://siphon-base-rpc:8545
      - ETH_SEPOLIA_RPC=${ETH_SEPOLIA_RPC:-https://ethereum-sepolia-rpc.publicnode.com}
      # v5 (VaultKernel) per-chain services — gateway 2.0. No cross-chain fallback by design:
      # an unset chain answers 503 rather than borrowing another chain's credentials.
      - ARBITRUM_RPC=${ARBITRUM_RPC:-https://arb1.arbitrum.io/rpc}
      - ASP_URL=http://siphon-aspv5-asp-1:5056
      - ASP_SCREEN_TOKEN=${GATEWAY_V5_ASP_SCREEN_TOKEN:?GATEWAY_V5_ASP_SCREEN_TOKEN must be set}
      - ASP_POSTMAN_TOKEN=${GATEWAY_V5_ASP_POSTMAN_TOKEN:?GATEWAY_V5_ASP_POSTMAN_TOKEN must be set}
      - V5_INDEXER_URL_8453=http://siphon-indexer-v3base:42069
      - V5_INDEXER_URL_42161=https://16-192-140-158.sslip.io/idx
      - EXECUTOR_URL_42161=https://16-192-140-158.sslip.io
      - ASP_URL_42161=https://16-192-140-158.sslip.io/aspv5
      - ASP_SCREEN_TOKEN_42161=${GATEWAY_ASP_SCREEN_TOKEN_42161:-}
      - ASP_POSTMAN_TOKEN_42161=${GATEWAY_ASP_POSTMAN_TOKEN_42161:-}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      trade-executor:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # The worker imports the SAME dependency chain as the gateway — worker_main ->
      # operation_monitor -> deps.clients -> adapters.sanctions -> reuse -> address_validator ->
      # asp_membership. It ran with only address_validator for as long as it could not start at
      # all; the moment worker_main.py existed it died on `No module named 'asp_membership'`.
      # Keep this list identical to api-gateway's.
      - ./trade-executor/address_validator.py:/app/address_validator.py:ro
      - ./trade-executor/asp_membership.py:/app/asp_membership.py:ro
      - ./trade-executor/evm_chain_config.py:/app/evm_chain_config.py:ro
      - ./trade-executor/session_key.py:/app/session_key.py:ro

  # Encryption happens in the browser (siphon-app/fhe-wasm); the client uploads only the
  # server key + ciphertext. There is no server-side payload generator.

  # Proving Relayer — server-side rapidsnark for /api/prove (else the frontend falls back to
  # browser snarkjs). Serves withdrawal and merge circuits (w1–w6, m2–m6) from the browser-bundle
  # artifacts mounted at /app/zk — the SAME zkeys the frontend uses, so proofs verify on-chain.
  # Witness is calculated with snarkjs (wasm-only), so no generate_witness.js is required.
  proving-relayer:
    build: ./proving-relayer
    container_name: proving-relayer
    ports:
      - "127.0.0.1:5010:5010"
    environment:
      - PROVING_RELAYER_PORT=5010
      - ZK_BUILD_DIR=/app/zk
      - RAPIDSNARK_BIN=/usr/local/bin/rapidsnark
      - SNARKJS_BIN=snarkjs
      - NODE_BIN=node
      # /prove is gated on X-API-TOKEN == API_TOKEN; reuse the shared executor token.
      - API_TOKEN=${API_TOKEN:?API_TOKEN must be set}
      - API_TOKEN_OLD=${API_TOKEN_OLD:-}
      - RECEIPT_SIGNER_DEV_KEY=${RECEIPT_SIGNER_DEV_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      # Browser-bundle circuit artifacts (siphon-app/public/zk), uploaded to ~/zk-build on the host.
      - ../zk-build-current:/app/zk:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5010/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Immutable soft-era proving lane for legacy withdrawals. It is isolated from the current
  # Hard ASP artifact mount so a release can never overwrite the proof bundle old vaults require.
  proving-relayer-legacy:
    build: ./proving-relayer
    container_name: proving-relayer-legacy
    ports:
      - "127.0.0.1:5011:5010"
    environment:
      - PROVING_RELAYER_PORT=5010
      - ZK_BUILD_DIR=/app/zk
      - RAPIDSNARK_BIN=/usr/local/bin/rapidsnark
      - SNARKJS_BIN=snarkjs
      - NODE_BIN=node
      - API_TOKEN=${API_TOKEN:?API_TOKEN must be set}
      - API_TOKEN_OLD=${API_TOKEN_OLD:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ${LEGACY_ZK_BUILD_DIR:-/home/ubuntu/legacy-server-capture/zk-build}:/app/zk:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5010/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  trade-executor-data:
    driver: local
  postgres_data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    name: siphon-network
    driver: bridge
